name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      # The backend serves the console, and its sign-in tests end on a console
      # route, so they need it built.
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: console/package-lock.json
      - name: console
        run: cd console && npm ci --no-audit --no-fund && npx vite build
      - name: gofmt
        run: test -z "$(gofmt -l $(git ls-files '*.go') | tee /dev/stderr)"
      - name: vet
        run: |
          go vet ./...
          GOOS=darwin go vet ./...
          GOOS=windows go vet ./...
      - name: test
        run: go test ./...

  console:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: console/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run
